[package]
name = "nocturne"
version = "0.1.0"
description = "Nocturne - fast local password manager"
authors = ["atherion"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
zeroize = "1"
arboard = "3"
ureq = "2"
sha1 = "0.10"
zxcvbn = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Argon2 is painfully slow unoptimised; keep dev builds usable.
[profile.dev.package."*"]
opt-level = 3
